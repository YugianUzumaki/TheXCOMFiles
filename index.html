function cardH(s){var alive=s.alive,um=UM[s.unitType]||UM.STR_SOLDIER,acc=alive?um.acc:"#c94f4f",bg=alive?um.bg:"rgba(32,14,14,.92)",bc=alive?um.bc:"#44202a",nc=alive?(s.unitType==="STR_DOG"?"#ead8b0":s.unitType==="STR_MUGGLE_AI"?"#b0e0ea":s.unitType==="STR_SOLDIER_NEKOMIMI"?"#ead8e8":s.unitType==="STR_KYBEROS"?"#ddd0f0":s.unitType==="STR_PROTEAN"?"#f0dcc8":s.unitType==="STR_OLYMPIAN"?"#f0eac0":s.unitType==="STR_INFERNAL"?"#f0ccc8":s.unitType==="STR_SPARTAN"?"#f0dcc0":"#d0ead0"):"#ead0d0";var rnk=(s.unitType!=="STR_DOG"&&s.unitType!=="STR_MUGGLE_AI")?"<span class='tbdg' style='color:#8a9898;background:rgba(138,152,152,0.1);border:1px solid rgba(138,152,152,0.3)'>"+(RL[s.rank]||"Rookie")+"</span>":"",tb=(alive&&um.lbl)?"<span class='tbdg' style='color:"+acc+";background:"+acc+"1a;border:1px solid "+acc+"55'>"+um.bdg+" "+um.lbl+"</span>":"",kia=!alive?(function(){var k="<div class='kia'>◆ KIA</div>";if(s.death&&(s.death.type||s.death.race)&&s.death.weapon){k+="<div style='font-size:10px;color:#8a5a5a;letter-spacing:.05em'>"+esc(fdt(s.death.day,s.death.month,s.death.year))+", "+esc(fsp(s.death.type||s.death.race))+", "+esc(fsp(s.death.weapon))+"</div>";}return k;})():"",comms=(s.commendations||[]).slice().sort(function(a,b){if(a.name==="STR_MEDAL_ORIGINAL8_NAME")return -1;if(b.name==="STR_MEDAL_ORIGINAL8_NAME")return 1;var ti=function(lv){return lv>=7?3:lv>=4?2:lv>=1?1:0;};var td=ti(b.level)-ti(a.level);if(td!==0)return td;return a.dn<b.dn?-1:a.dn>b.dn?1:0;}),open=!!ex[s.id],inner="";if(open){var boosted=!!bx[s.id],bn=boosted?cb(s.commendations||[]):{};var sh="";for(var i=0;i<SK.length;i++){sh+=sbh(SL[SK[i]],s.initialStats[SK[i]]||0,s.currentStats[SK[i]]||0,bn[SK[i]]||0);}var cch="";if(comms.length){var bh="";for(var j=0;j<comms.length;j++){var c=comms[j],cs=ms(c.level),cl=c.level>0?" Lv"+c.level:"";bh+="<span class='cbdg' style='background:"+cs[0]+";border:1px solid "+cs[1]+";color:"+cs[2]+"'>"+esc(c.dn)+cl+"</span>";}cch="<div class='csec'><div class='ctit'>COMMENDATIONS ("+comms.length+")</div><div class='cbdgs'>"+bh+"</div></div>";}var sthdr=comms.length?"<div class='sthdr'><span class='sttl'>STATS</span><button class='togbtn' onclick='event.stopPropagation();togB("+s.id+")' style='border:1px solid "+(boosted?acc+"55":"#2a442a")+";background:"+(boosted?acc+"18":"rgba(79,201,122,0.04)")+";color:"+(boosted?acc:"#3d6a3d")+"'>"+(boosted?"✦ WITH COMMENDATIONS":"◇ BASE STATS")+"</button></div>":"";var mb=cmb(s.commendations||[]),hasMisc=(mb.moraleRecovery||mb.energyRecovery||mb.stunRecovery||mb.nightVision)>0,mOpen=!!mx[s.id],mch="";if(hasMisc){var mitms="";if(mb.moraleRecovery>0)mitms+="<span class='psitem'><span class='psval'>+"+mb.moraleRecovery+"</span> per turn Morale Recovery</span>";if(mb.energyRecovery>0)mitms+="<span class='psitem'><span class='psval'>+"+mb.energyRecovery+"</span> per turn Energy Recovery</span>";if(mb.stunRecovery>0)mitms+="<span class='psitem'><span class='psval'>+"+mb.stunRecovery+"</span> per turn Stun Recovery</span>";if(mb.nightVision>0)mitms+="<span class='psitem'><span class='psval'>+"+mb.nightVision+"</span> tiles Night Vision</span>";mch="<div style='margin-top:14px'><div class='pshdr' onclick='event.stopPropagation();togM("+s.id+")'><span>PASSIVE BONUSES</span><span style='font-size:10px;color:#2d5a4a'>"+(mOpen?"▲":"▼")+"</span></div>"+(mOpen?"<div class='psbns'>"+mitms+"</div>":"")+"</div>";}inner="<div class='xpnd' style='border-top:1px solid "+bc+"'>"+sthdr+"<div class='sgrid'>"+sh+"</div>"+mch+cch+"</div>";}return "<div class='card' data-id='"+s.id+"' style='background:"+bg+";border:1px solid "+bc+";border-left:3px solid "+acc+"' onclick='tog("+s.id+")'><div class='crow'><div class='cid' style='color:"+(alive?um.dim:"#6a2d2d")+"'>#"+String(s.id).padStart(3,"0")+"</div><div class='cnw'><div class='cnr'><span class='cname' style='color:"+nc+"'>"+esc(s.name)+"</span>"+rnk+tb+"</div>"+kia+"</div><div class='chips'>"+ch("MSNS",s.missions,"#c9a94f")+ch("KLS",s.kills,"#c97a7a")+ch("STN",s.stuns,"#7ac9c9")+ch("DCR",comms.length,"#c07ad9")+"</div><div class='chev'>"+(open?"▲":"▼")+"</div></div>"+inner+"</div>";}
function sortPool(pool){var f=st.sortBy;pool.sort(function(a,b){var va,vb;if(f==="id"){va=a.id;vb=b.id;}else if(f==="missions"){va=a.missions;vb=b.missions;}else if(f==="kills"){va=a.kills;vb=b.kills;}else if(f==="stuns"){va=a.stuns;vb=b.stuns;}else{va=(a.commendations||[]).length;vb=(b.commendations||[]).length;}return(va-vb)*st.sortDir;});return pool;}
function filterPool(pool){var q=st.search.toLowerCase();return q?pool.filter(function(s){return s.name.toLowerCase().indexOf(q)>=0;}):pool.slice();}
function togBase(i){bex[i]=!bex[i];rc();}
function baseH(i){
  var baseName=BASES[i];
  var pool=S.filter(function(s){return s.alive&&s.baseName===baseName;});
  var f=sortPool(filterPool(pool));
  var open=bex[i];
  if(st.search&&f.length===0)return "";
  var cnt=st.search?(f.length+" / "+pool.length):String(pool.length);
  return "<div class='bgrp'><div class='bhdr"+(open?"":" closed")+"' onclick='togBase("+i+")'><span class='bname'>"+esc(baseName).toUpperCase()+"</span><span class='bcnt'>"+cnt+" PERSONNEL</span><span class='bchev'>"+(open?"▲":"▼")+"</span></div>"+(open?f.map(cardH).join(""):"")+"</div>";
}
function rc(){
  var isL=st.tab==="living";
  var cnt=document.getElementById("cnt"),cards=document.getElementById("cards");
  if(isL){
    var html=BASES.map(function(_,i){return baseH(i);}).join("");
    var totalShown=BASES.reduce(function(acc,_,i){return acc+sortPool(filterPool(S.filter(function(s){return s.alive&&s.baseName===BASES[i];}))).length;},0);
    var totalLiving=S.filter(function(s){return s.alive;}).length;
    cnt.textContent="DISPLAYING "+totalShown+" OF "+totalLiving+" RECORDS";
    cards.innerHTML=html||"<div class='empty'>NO RECORDS FOUND</div>";
  } else {
    var pool=S.filter(function(s){return !s.alive;}),f=sortPool(filterPool(pool));
    cnt.textContent="DISPLAYING "+f.length+" OF "+pool.length+" RECORDS";
    cards.innerHTML=f.length?f.map(cardH).join(""):"<div class='empty'>NO RECORDS FOUND</div>";
  }
}
